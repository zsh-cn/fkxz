<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.png" type="image/png">
<title>文件下载</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { background: #fff; border-radius: 8px; padding: 24px; max-width: 500px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
h1 { font-size: 20px; color: #1a73e8; margin-bottom: 16px; text-align: center; }
.file-info { background: #e8f0fe; border-radius: 4px; padding: 12px; margin-bottom: 16px; display: none; }
.file-info.show { display: block; }
.info-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.info-label { color: #666; }
.info-value { color: #1a73e8; font-weight: 500; }
.progress-section { display: none; margin-bottom: 16px; }
.progress-section.show { display: block; }
.progress-text { font-size: 12px; color: #666; text-align: center; }

.btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; background: #4285f4; color: white; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-resume { background: #34a853; display: none; margin-top: 8px; }
.btn-resume.show { display: block; }
</style>
</head>
<body>
<div class="container">
    <h1>文件下载</h1>
    <div class="file-info" id="fileInfo">
        <div class="info-row"><span class="info-label">文件名：</span><span class="info-value" id="fileName">-</span></div>
        <div class="info-row"><span class="info-label">文件大小：</span><span class="info-value" id="fileSize">-</span></div>
        <div class="info-row" id="resumeRow" style="display:none;">
            <span class="info-label">下载进度：</span>
            <span class="info-value" id="resumeProgress">-</span>
        </div>
    </div>
    <div class="progress-section" id="progressSection">
        <div class="progress-text" id="progressText">准备中...</div>
    </div>

    <button class="btn" id="downloadBtn" disabled>下载</button>
    <button class="btn btn-resume" id="resumeBtn">继续下载</button>
</div>
<script>
let fkxInfo = null, baseUrl = '', resumeOffset = 0;
let _fkxParam = null;

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function getBaseUrl(url) {
    const parsed = new URL(url, window.location.href);
    const pathParts = parsed.pathname.split('/');
    pathParts.pop();
    return parsed.origin + pathParts.join('/') + '/';
}

function parseFkx(content) {
    const info = { chunks: [] };
    for (const line of content.trim().split('\n')) {
        const eqIdx = line.indexOf('=');
        if (eqIdx < 0) continue;
        const key = line.substring(0, eqIdx), value = line.substring(eqIdx + 1);
        if (key.startsWith('chunk_')) {
            const parts = value.split(',');
            if (parts.length >= 2) info.chunks.push({
                filename: parts[0].trim().replace(/^.*[\\/]/, ''),
                size: parseInt(parts[1].trim()) || 0
            });
        } else info[key] = value.trim();
    }
    return info;
}

function showMessage(text) {
    document.getElementById('progressSection').classList.add('show');
    document.getElementById('progressText').textContent = text;
}

async function parseFkxUrl(url) {
    const btn = document.getElementById('downloadBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    document.getElementById('fileInfo').classList.remove('show');
    btn.disabled = true;
    resumeBtn.classList.remove('show');
    try {
        showMessage('获取文件信息...');
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        fkxInfo = parseFkx(await res.text());
        if (!fkxInfo.filename || !fkxInfo.chunks?.length) throw new Error('格式错误');

        baseUrl = getBaseUrl(url);
        const totalSize = fkxInfo.chunks.reduce((s, c) => s + c.size, 0);

        document.getElementById('fileName').textContent = fkxInfo.filename;
        document.getElementById('fileSize').textContent = formatSize(totalSize);
        document.getElementById('fileInfo').classList.add('show');
        btn.disabled = false;
        showMessage('准备就绪');
    } catch (e) {
        showMessage('解析失败: ' + e.message);
    }
}

function startDownload(offset) {
    if (!fkxInfo?.chunks?.length) return;
    const btn = document.getElementById('downloadBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    btn.disabled = true;
    resumeBtn.disabled = true;

    const fkxUrl = /^https?:\/\//i.test(_fkxParam) ? _fkxParam : new URL(_fkxParam, window.location.href).href;
    const absoluteFkxUrl = new URL(fkxUrl, window.location.origin + window.location.pathname).href;
    const downloadUrl = new URL('./fkxz', window.location.href);
    downloadUrl.searchParams.set('fkx', absoluteFkxUrl);
    if (offset > 0) downloadUrl.searchParams.set('resume', String(offset));

    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;border:none;';
    document.body.appendChild(iframe);

    iframe.src = downloadUrl.href;

    showMessage('下载已开始，请查看浏览器下载栏');
    setTimeout(() => {
        btn.disabled = false;
        resumeBtn.disabled = false;
        if (iframe.parentNode) iframe.remove();
    }, 5000);
}

window.addEventListener('DOMContentLoaded', async () => {
    if ('serviceWorker' in navigator) {
        try {
            const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
            await navigator.serviceWorker.ready;
            console.log('SW 已注册:', reg.scope);
        } catch (e) {
            showMessage('Service Worker 注册失败: ' + e.message);
        }
    }

    const fkxParam = new URLSearchParams(window.location.search).get('fkx');
    const saved = sessionStorage.getItem('fkx_resume');
    if (fkxParam) {
        _fkxParam = fkxParam;
        if (saved) {
            try {
                const state = JSON.parse(saved);
                resumeOffset = state.offset || 0;
                fkxInfo = {
                    chunks: state.chunks.split('\n').map(l => {
                        const p = l.split(',');
                        return { filename: p[0].trim(), size: parseInt(p[1]) || 0 };
                    }),
                    filename: state.filename
                };
                const totalSize = fkxInfo.chunks.reduce((s, c) => s + c.size, 0);
                document.getElementById('fileName').textContent = fkxInfo.filename;
                document.getElementById('fileSize').textContent = formatSize(totalSize);
                document.getElementById('resumeProgress').textContent = formatSize(resumeOffset);
                document.getElementById('resumeRow').style.display = 'flex';
                document.getElementById('downloadBtn').disabled = false;
                document.getElementById('resumeBtn').classList.add('show');
                return;
            } catch (e) { sessionStorage.removeItem('fkx_resume'); }
        }
        parseFkxUrl(fkxParam);
    } else {
        showMessage('缺少文件参数');
    }
    document.getElementById('downloadBtn').addEventListener('click', () => startDownload(0));
    document.getElementById('resumeBtn').addEventListener('click', () => startDownload(resumeOffset));
});
</script>
</body>
</html>
