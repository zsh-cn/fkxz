<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.png" type="image/png">
<title>文件下载器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { background: #fff; border-radius: 8px; padding: 24px; max-width: 500px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
h1 { font-size: 20px; color: #1a73e8; margin-bottom: 16px; text-align: center; }
.file-info { background: #e8f0fe; border-radius: 4px; padding: 12px; margin-bottom: 16px; display: none; }
.file-info.show { display: block; }
.info-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.info-label { color: #666; }
.info-value { color: #1a73e8; font-weight: 500; }
.progress-section { display: none; margin-bottom: 16px; }
.progress-section.show { display: block; }
.progress-bar { height: 6px; background: #e8f0fe; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.progress-bar.hidden { display: none; }
.progress-fill { height: 100%; background: #4285f4; width: 0%; }
.progress-text { font-size: 12px; color: #666; text-align: center; }

.btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; background: #4285f4; color: white; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-cancel { background: #ea4335; display: none; }
.btn-cancel.show { display: block; }
</style>
</head>
<body>
<div class="container">
    <h1>文件下载</h1>
    <div class="file-info" id="fileInfo">
        <div class="info-row"><span class="info-label">文件名：</span><span class="info-value" id="fileName">-</span></div>
        <div class="info-row"><span class="info-label">文件大小：</span><span class="info-value" id="fileSize">-</span></div>
    </div>
    <div class="progress-section" id="progressSection">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">准备中...</div>
    </div>
    
    <button class="btn" id="downloadBtn" disabled>下载</button>
    <button class="btn btn-cancel" id="cancelBtn">取消下载</button>
</div>
<script>
let fkxInfo = null, baseUrl = '', isDownloading = false, abortController = null;

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function formatSpeed(bytesPerSecond) {
    if (bytesPerSecond < 1024) return bytesPerSecond.toFixed(0) + ' B/s';
    if (bytesPerSecond < 1024 * 1024) return (bytesPerSecond / 1024).toFixed(1) + ' KB/s';
    return (bytesPerSecond / 1024 / 1024).toFixed(1) + ' MB/s';
}

function getBaseUrl(url) {
    const parsed = new URL(url);
    const pathParts = parsed.pathname.split('/');
    pathParts.pop();
    return parsed.origin + pathParts.join('/') + '/';
}

function parseFkx(content) {
    const info = { chunks: [] };
    for (const line of content.trim().split('\n')) {
        const eqIdx = line.indexOf('=');
        if (eqIdx < 0) continue;
        const key = line.substring(0, eqIdx), value = line.substring(eqIdx + 1);
        if (key.startsWith('chunk_')) {
            const parts = value.split(',');
            if (parts.length >= 2) info.chunks.push({
                filename: parts[0].trim().replace(/^.*[\\/]/, ''),
                size: parseInt(parts[1].trim()) || 0
            });
        } else info[key] = value.trim();
    }
    return info;
}



function updateProgress(current, total, text) {
    document.getElementById('progressSection').classList.add('show');
    document.getElementById('progressFill').style.width = total > 0 ? ((current / total) * 100).toFixed(1) + '%' : '0%';
    document.getElementById('progressText').textContent = text || '';
}

function showMessage(text) {
    document.getElementById('progressSection').classList.add('show');
    document.getElementById('progressText').textContent = text;
}

async function parseFkxUrl(url) {
    const btn = document.getElementById('downloadBtn');
    document.getElementById('fileInfo').classList.remove('show');
    btn.disabled = true;
    try {
        showMessage('获取文件信息...');
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        fkxInfo = parseFkx(await res.text());
        if (!fkxInfo.filename || !fkxInfo.chunks?.length) throw new Error('格式错误');
        
        baseUrl = getBaseUrl(url);
        const totalSize = fkxInfo.chunks.reduce((s, c) => s + c.size, 0);
        
        document.getElementById('fileName').textContent = fkxInfo.filename;
        document.getElementById('fileSize').textContent = formatSize(totalSize);
        document.getElementById('fileInfo').classList.add('show');
        btn.disabled = false;
        showMessage('准备就绪');
    } catch (e) {
        showMessage('解析失败: ' + e.message);
    }
}

async function downloadAndMerge() {
    if (!fkxInfo?.chunks?.length || isDownloading) return;
    isDownloading = true;
    abortController = new AbortController();
    const btn = document.getElementById('downloadBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    btn.style.display = 'none';
    cancelBtn.classList.add('show');
    
    const totalSize = fkxInfo.chunks.reduce((s, c) => s + c.size, 0);
    const useFileSystemAccess = 'showSaveFilePicker' in window;
    const progressBar = document.getElementById('progressFill').parentElement;
    if (!useFileSystemAccess) progressBar.classList.add('hidden');
    let fileHandle = null, writer = null, blobParts = [], downloaded = 0;
    let speedLastTime = Date.now(), speedLastBytes = 0;
    
    try {
        const sanitizedName = fkxInfo.filename.replace(/[<>:"/\\|?*]/g, '_');
        
        if (useFileSystemAccess) {
            try {
                fileHandle = await window.showSaveFilePicker({ suggestedName: sanitizedName, types: [{ description: '所有文件', accept: { '*/*': [] } }] });
                writer = await fileHandle.createWritable();
            } catch (e) {
                if (e.name === 'AbortError') { resetDownloadState(); return; }
                throw new Error('无法获取文件写入权限: ' + e.message);
            }
        }
        
        for (let i = 0; i < fkxInfo.chunks.length; i++) {
            if (abortController.signal.aborted) throw new DOMException('已取消', 'AbortError');
            const chunk = fkxInfo.chunks[i];
            
            const res = await fetch(baseUrl + chunk.filename, { signal: abortController.signal });
            if (!res.ok) throw new Error('下载失败: ' + chunk.filename);
            
            const reader = res.body.getReader();
            const buffers = [];
            let chunkLoaded = 0;
            
            while (true) {
                if (abortController.signal.aborted) { reader.cancel(); throw new DOMException('已取消', 'AbortError'); }
                const { done, value } = await reader.read();
                if (done) break;
                buffers.push(value);
                chunkLoaded += value.length;
                const now = Date.now();
                let speedStr = '';
                const currentBytes = downloaded + chunkLoaded;
                if (now - speedLastTime > 500) {
                    const elapsed = (now - speedLastTime) / 1000;
                    if (elapsed > 0) speedStr = '  ·  ' + formatSpeed((currentBytes - speedLastBytes) / elapsed);
                    speedLastTime = now;
                    speedLastBytes = currentBytes;
                }
                updateProgress(currentBytes, totalSize, `${formatSize(currentBytes)}/${formatSize(totalSize)}${speedStr}`);
            }
            
            const chunkBlob = new Blob(buffers);
            if (useFileSystemAccess && writer) await writer.write(await chunkBlob.arrayBuffer());
            else blobParts.push(chunkBlob);
            downloaded += chunk.size;
        }
        
        updateProgress(totalSize, totalSize, '合并中...');
        
        if (useFileSystemAccess && writer) {
            await writer.close();
        } else {
            const merged = new Blob(blobParts);
            const url = URL.createObjectURL(merged);
            const a = document.createElement('a');
            a.href = url;
            a.download = sanitizedName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        updateProgress(totalSize, totalSize, '下载完成');
    } catch (e) {
        if (e.name === 'AbortError') {
            showMessage('下载已取消');
            if (writer) try { await writer.abort(); } catch (e) {}
        } else {
            showMessage('下载失败: ' + e.message);
            if (writer) try { await writer.close(); } catch (e) {}
        }
    } finally {
        resetDownloadState();
    }
}

function resetDownloadState() {
    isDownloading = false;
    abortController = null;
    const btn = document.getElementById('downloadBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    btn.style.display = '';
    btn.disabled = false;
    cancelBtn.classList.remove('show');
    document.getElementById('progressFill').parentElement.classList.remove('hidden');
}

function cancelDownload() {
    if (abortController) {
        abortController.abort();
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const fkxParam = new URLSearchParams(window.location.search).get('fkx');
    if (fkxParam) {
        const fkxUrl = /^https?:\/\//i.test(fkxParam) ? fkxParam : new URL(fkxParam, window.location.href).href;
        parseFkxUrl(fkxUrl);
    } else showMessage('缺少文件参数');
    document.getElementById('downloadBtn').addEventListener('click', downloadAndMerge);
    document.getElementById('cancelBtn').addEventListener('click', cancelDownload);
});
</script>
</body>
</html>
