# ── 站点信息 ──
title: fkxz - 文件分块下载
description: 将大文件拆分为多个小分片，支持本地合并与远程下载合并，轻松绕过文件上传大小限制
lang: zh-CN
url: https://zsh-cn.github.io
baseurl: /fkxz
repository: zsh-cn/fkxz

# ── 构建设置 ──
markdown: kramdown
highlighter: rouge

# 保留所有静态文件，不做额外处理
keep_files:
  - css
  - js
  - icons
  - wjxz

# 确保这些目录/文件被包含
include:
  - .nojekyll
  - css
  - js
  - icons
  - wjxz

# 排除不需要发布的文件
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

# ── 默认布局 ──
defaults:
  - scope:
      path: ""
    values:
      layout: null
