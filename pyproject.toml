[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fkxz"
version = "3.1.1"
description = "文件分块下载 - 大文件分片传输工具，将大文件拆分为多个小分片，支持本地合并与远程下载合并"
readme = "README.md"
license = { text = "MPL-2.0" }
requires-python = ">=3.8"
authors = [
    { name = "zsh-cn" },
]
keywords = [
    "file-splitter",
    "file-downloader",
    "chunked-download",
    "large-file-transfer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: File Transfer Protocol (FTP)",
    "Topic :: System :: Archiving :: Packaging",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.25.0,<3.0",
]

[project.optional-dependencies]
enhanced = [
    "curl_cffi>=0.5.0,<1.0",
]

[project.scripts]
fkxz = "cli.main:main"

[project.urls]
Homepage = "https://github.com/zsh-cn/fkxz"
Repository = "https://github.com/zsh-cn/fkxz"
Issues = "https://github.com/zsh-cn/fkxz/issues"

[tool.setuptools]
packages = ["cli", "app", "app.core", "app.ui", "app.utils"]
py-modules = ["file_downloader", "file_splitter"]

[tool.setuptools.package-data]
app = ["*.py"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["cli", "app"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [".venv"]

[tool.coverage.run]
source = ["cli", "app"]
omit = [".venv/*", "tests/*"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]